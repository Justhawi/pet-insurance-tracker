name: Keep Render awake

# Render free-tier containers sleep after 15 min of no HTTP requests, and
# when they wake their disk resets to the last build. To prevent both, this
# workflow runs an hourly long-job that pings every 60 seconds, AND every
# 5 minutes re-publishes the latest committed companies_data.json to
# /api/upload so the live site always reflects the freshest data even right
# after a (rare) restart.
#
# Repo is public, so Actions minutes are unlimited.

on:
  schedule:
    - cron: '0 * * * *'      # start a fresh 58-min loop at the top of every hour
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      CLOUD_URL: https://pet-insurance-tracker.onrender.com
      CLOUD_KEY: ${{ secrets.CLOUD_KEY }}

    steps:
      - name: Check out repo (for companies_data.json)
        uses: actions/checkout@v4

      - name: Ping + re-publish loop for ~58 minutes
        run: |
          set -u
          END=$(( $(date +%s) + 58*60 ))
          TICK=0
          while [ "$(date +%s)" -lt "$END" ]; do
            TICK=$((TICK+1))

            # Ping /api/status every minute to keep the container awake
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 --connect-timeout 15 --retry 2 --retry-delay 3 \
              "$CLOUD_URL/api/status" || echo "000")
            echo "[$TICK] ping /api/status -> $STATUS"

            # Every 5 minutes, also re-publish the latest committed data file
            # so the live numbers immediately match GitHub after any restart.
            if [ $((TICK % 5)) -eq 0 ] && [ -n "${CLOUD_KEY}" ]; then
              if [ -s companies_data.json ]; then
                UP=$(curl -s -o /tmp/up_body -w "%{http_code}" \
                  --max-time 60 --connect-timeout 30 \
                  -X POST -H 'Content-Type: application/json' \
                  -H "X-Upload-Key: $CLOUD_KEY" \
                  --data-binary @companies_data.json \
                  "$CLOUD_URL/api/upload" || echo "000")
                echo "[$TICK] re-publish -> $UP $(head -c 120 /tmp/up_body || true)"
              fi
            fi

            sleep 60
          done
          echo "Loop finished."
